name: Publish production image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag
        required: true
        type: string
      push_latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean
      xray_version:
        description: Xray release tag
        required: true
        default: v26.3.27
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          tags="ghcr.io/xpointlabs/xnode:${IMAGE_TAG}"
          if [[ "$PUSH_LATEST" == "true" ]]; then
            tags="${tags}"$'\n'"ghcr.io/xpointlabs/xnode:latest"
          fi
          {
            echo 'value<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            XRAY_VERSION=${{ inputs.xray_version }}
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/XPointLabs/xnode
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=xnode-production
          cache-to: type=gha,scope=xnode-production,mode=max
