name: ci

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'release-candidate/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xnode
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-protocol
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Restore
        working-directory: xnode
        run: dotnet restore tests/XNode.Tests/XNode.Tests.csproj -p:DeepProtocolSourceCutover=true
      - name: Build
        working-directory: xnode
        run: dotnet build tests/XNode.Tests/XNode.Tests.csproj --configuration Release --no-restore -p:DeepProtocolSourceCutover=true
      - name: Unit tests
        working-directory: xnode
        run: dotnet test tests/XNode.Tests/XNode.Tests.csproj --configuration Release --no-build --logger trx -p:DeepProtocolSourceCutover=true

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      Vless__MockProcess: "true"
      Vless__XrayExecutablePath: "mock"
    steps:
      - uses: actions/checkout@v4
        with:
          path: xnode
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-protocol
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Restore
        working-directory: xnode
        run: dotnet restore tests/XNode.IntegrationTests/XNode.IntegrationTests.csproj -p:DeepProtocolSourceCutover=true
      - name: Build
        working-directory: xnode
        run: dotnet build tests/XNode.IntegrationTests/XNode.IntegrationTests.csproj --configuration Release --no-restore -p:DeepProtocolSourceCutover=true
      - name: Integration tests with mocked Xray
        working-directory: xnode
        run: dotnet test tests/XNode.IntegrationTests/XNode.IntegrationTests.csproj --configuration Release --no-build --logger trx --results-directory artifacts/test-results/c3 -p:DeepProtocolSourceCutover=true
      - name: Upload C3 test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c3-test-results
          path: xnode/artifacts/test-results/c3
          if-no-files-found: error

  publish-linux-x64:
    runs-on: ubuntu-latest
    needs: [ build-test, integration-tests ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: xnode
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-protocol
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Restore current protocol multi-RID graph
        working-directory: xnode
        run: dotnet restore src/XNode/XNode.csproj -p:DeepProtocolSourceCutover=true
      - name: Publish self-contained linux-x64
        working-directory: xnode
        run: >
          dotnet publish src/XNode/XNode.csproj
          --configuration Release
          --runtime linux-x64
          --no-restore
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DeepProtocolSourceCutover=true
          --output artifacts/xnode-linux-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnode-linux-x64
          path: xnode/artifacts/xnode-linux-x64
